name: Deploy RTX Spark Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: swa-rtx-aserdargun-com-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy prebuilt site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SWA_RTX_ASERDARGUN_COM }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
